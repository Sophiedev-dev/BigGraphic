<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      :root {
        --accent: #ff3366;

        /* Le premier set : Dark Mode */
        --bg-dark: #0f1220;
        --text-dark: #ffffff;

        /* Le deuxième set : Light Mode */
        --bg-light: #ffffff;
        --text-light: #111111;

        --radius: 4px;
        --raduis2: 24px;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        --shadow2: 0 10px 30px rgba(0, 0, 0, 0.9);

        --space-sm: 8px;
        --space-md: 16px;
        --space-lg: 40px;
        --space-xl: 64px;

        --text-xs: 12px;
        --text-sm: 14px;
        --text-md: 18px;
        --text-lg: 24px;
        --text-xl: 40px;
        --text-2xl: 64px;
      }
      h1,
      h2 {
        font-family: Georgia, serif;
      }
      p {
        font-family: Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <div style="display: flex; flex-direction: row; gap: var(--space-xl)">
      <div
        style="
          width: 300px;
          height: 200px;
          background: var(--bg-light);
          padding: var(--space-md);
          border-radius: var(--radius);
          box-shadow: var(--shadow);
        "
      >
        <p
          style="
            font-family: sans-serif;
            color: var(--text-light);
            font-size: var(--text-sm);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.12em;
          "
        >
          Welcome
        </p>
        <h2
          style="
            font-family: sans-serif;
            color: var(--accent);
            text-transform: uppercase;
            font-size: var(--text-lg);
            font-weight: 800;
            letter-spacing: 0.12em;
            margin-top: var(--space-md);
            margin-bottom: var(--space-lg);
          "
        >
          Light Mode
        </h2>
        <p
          style="
            font-family: sans-serif;
            color: var(--text-light);
            font-size: var(--text-sm);
            font-weight: 500;
            letter-spacing: 0.12em;
          "
        >
          Subheading for the first box
        </p>
      </div>
      <div
        style="
          width: 300px;
          height: 200px;
          background: var(--bg-dark);
          padding: var(--space-md);
          border-radius: var(--radius);
          box-shadow: var(--shadow);
        "
      >
        <p
          style="
            font-family: sans-serif;
            color: var(--text-dark);
            font-size: var(--text-sm);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.12em;
          "
        >
          Welcome
        </p>
        <h2
          style="
            font-family: sans-serif;
            color: var(--accent);
            text-transform: uppercase;
            font-size: var(--text-lg);
            font-weight: 800;
            letter-spacing: 0.12em;
            margin-top: var(--space-md);
            margin-bottom: var(--space-lg);
          "
        >
          Dark mode
        </h2>
        <p
          style="
            font-family: sans-serif;
            color: var(--text-dark);
            font-size: var(--text-sm);
            font-weight: 500;
            letter-spacing: 0.12em;
          "
        >
          Subheading for the second box
        </p>
      </div>
    </div>
  </body>
</html>
