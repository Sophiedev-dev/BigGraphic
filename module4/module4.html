<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      :root {
        --bg: #ffffff;
        --text: #111111;
        --accent: #111111;

        --bg2: #0f1220;
        --text2: #ffffff;
        --accent2: #ff3366;

        --bg3: #0a0a0a;
        --text3: #f5f5f5;
        --accent3: #d4af37;

        --radius: 4px;
        --raduis2: 24px;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        --shadow2: 0 10px 30px rgba(0, 0, 0, 0.9);

        --space-sm: 8px;
        --space-md: 16px;
        --space-lg: 40px;
        --space-xl: 64px;

        --text-xs: 12px;
        --text-sm: 14px;
        --text-md: 18px;
        --text-lg: 24px;
        --text-xl: 40px;
        --text-2xl: 64px;
      }
      h1,
      h2 {
        font-family: Georgia, serif;
      }
      p {
        font-family: Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <div style="display: flex; flex-direction: row; gap: 8px">
      <div
        style="
          width: 300px;
          height: 200px;
          background: var(--bg);
          padding: var(--space-md);
          border-radius: var(--radius);
          box-shadow: var(--shadow);
        "
      >
        <p
          style="
            font-family: sans-serif;
            color: var(--text);
            font-size: var(--text-sm);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.12em;
          "
        >
          Welcome
        </p>
        <h2
          style="
            font-family: sans-serif;
            color: var(--accent);
            text-transform: uppercase;
            font-size: var(--text-lg);
            font-weight: 800;
            letter-spacing: 0.12em;
            margin-top: var(--space-md);
            margin-bottom: var(--space-lg);
          "
        >
          Palette A
        </h2>
        <p
          style="
            font-family: sans-serif;
            color: var(--text);
            font-size: var(--text-sm);
            font-weight: 500;
            letter-spacing: 0.12em;
          "
        >
          Subheading for the first box
        </p>
      </div>
      <div
        style="
          width: 300px;
          height: 200px;
          background: var(--bg2);
          padding: var(--space-md);
          border-radius: var(--radius);
          box-shadow: var(--shadow);
        "
      >
        <p
          style="
            font-family: sans-serif;
            color: var(--text2);
            font-size: var(--text-sm);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.12em;
          "
        >
          Welcome
        </p>
        <h2
          style="
            font-family: sans-serif;
            color: var(--accent2);
            text-transform: uppercase;
            font-size: var(--text-lg);
            font-weight: 800;
            letter-spacing: 0.12em;
            margin-top: var(--space-md);
            margin-bottom: var(--space-lg);
          "
        >
          Palette B
        </h2>
        <p
          style="
            font-family: sans-serif;
            color: var(--text2);
            font-size: var(--text-sm);
            font-weight: 500;
            letter-spacing: 0.12em;
          "
        >
          Subheading for the second box
        </p>
      </div>
      <div
        style="
          width: 300px;
          height: 200px;
          background: var(--bg3);
          padding: var(--space-md);
          border-radius: var(--radius);
          box-shadow: var(--shadow);
        "
      >
        <p
          style="
            font-family: sans-serif;
            color: var(--text3);
            font-size: var(--text-sm);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.12em;
          "
        >
          Welcome
        </p>
        <h2
          style="
            font-family: sans-serif;
            color: var(--accent3);
            text-transform: uppercase;
            font-size: var(--text-lg);
            font-weight: 800;
            letter-spacing: 0.12em;
            margin-top: var(--space-md);
            margin-bottom: var(--space-lg);
          "
        >
          Palette C
        </h2>
        <p
          style="
            font-family: sans-serif;
            color: var(--text3);
            font-size: var(--text-sm);
            font-weight: 500;
            letter-spacing: 0.12em;
          "
        >
          Subheading for the third box
        </p>
      </div>
    </div>
  </body>
</html>
