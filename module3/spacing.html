<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      :root {
        --accent: #e94560;
        --bg: #3b82f6;
        --text: #ffffff;
        --text-color: #1e293b;
        --bg2: #ff5fa2;
        --text-color2: #1e293b;
        --bg3: #d4af37;
        --text-color3: #0f0f0f;

        --radius: 4px;
        --raduis2: 24px;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        --shadow2: 0 10px 30px rgba(0, 0, 0, 0.9);

        --space-sm: 8px;
        --space-md: 16px;
        --space-lg: 40px;
        --space-xl: 64px;

        --text-xs: 12px;
        --text-sm: 14px;
        --text-md: 18px;
        --text-lg: 24px;
        --text-xl: 40px;
        --text-2xl: 64px;
      }
      h1,
      h2 {
        font-family: Georgia, serif;
      }
      p {
        font-family: Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <div style="display: flex; flex-direction: row; gap: 8px">
      <div
        style="
          width: 300px;
          height: 200px;
          background: var(--text-color);
          padding: var(--space-md);
          border-radius: var(--radius);
          box-shadow: var(--shadow);
        "
      >
        <p
          style="
            font-family: sans-serif;
            color: var(--text);
            font-size: var(--text-sm);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.12em;
          "
        >
          Welcome
        </p>
        <h2
          style="
            font-family: sans-serif;
            color: var(--bg);
            text-transform: uppercase;
            font-size: var(--text-lg);
            font-weight: 800;
            letter-spacing: 0.12em;
            margin-top: var(--space-md);
            margin-bottom: var(--space-lg);
          "
        >
          Heading 1
        </h2>
        <p
          style="
            font-family: sans-serif;
            color: var(--text);
            font-size: var(--text-sm);
            font-weight: 500;
            letter-spacing: 0.12em;
          "
        >
          Subheading for the first box
        </p>
      </div>
      <div
        style="
          width: 300px;
          height: 200px;
          background: var(--text-color2);
          padding: var(--space-md);
          border-radius: var(--raduis2);
          box-shadow: var(--shadow2);
        "
      >
        <p
          style="
            font-family: sans-serif;
            color: var(--text);
            font-size: var(--text-sm);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.12em;
          "
        >
          Welcome
        </p>
        <h2
          style="
            font-family: sans-serif;
            color: var(--bg2);
            text-transform: uppercase;
            font-size: var(--text-lg);
            font-weight: 800;
            letter-spacing: 0.12em;
            margin-top: var(--space-md);
            margin-bottom: var(--space-lg);
          "
        >
          Heading 2
        </h2>
        <p
          style="
            font-family: sans-serif;
            color: var(--text);
            font-size: var(--text-sm);
            font-weight: 500;
            letter-spacing: 0.12em;
          "
        >
          Subheading for the second box
        </p>
      </div>
      <div
        style="
          width: 300px;
          height: 200px;
          background: var(--text-color3);
          padding: var(--space-md);
        "
      >
        <p
          style="
            font-family: sans-serif;
            color: var(--text);
            font-size: var(--text-sm);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.12em;
          "
        >
          Welcome
        </p>
        <h2
          style="
            font-family: sans-serif;
            color: var(--bg3);
            text-transform: uppercase;
            font-size: var(--text-lg);
            font-weight: 800;
            letter-spacing: 0.12em;
            margin-top: var(--space-md);
            margin-bottom: var(--space-lg);
          "
        >
          Heading 3
        </h2>
        <p
          style="
            font-family: sans-serif;
            color: var(--text);
            font-size: var(--text-sm);
            font-weight: 500;
            letter-spacing: 0.12em;
          "
        >
          Subheading for the third box
        </p>
      </div>
    </div>
  </body>
</html>
