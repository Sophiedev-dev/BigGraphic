<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      :root {
        --accent: #e94560;
        --bg: #3b82f6;
        --text: #ffffff;
        --text-color: #1e293b;
        --bg2: #ff5fa2;
        --text-color2: #1e293b;
        --bg3: #d4af37;
        --text-color3: #0f0f0f;
      }
    </style>
  </head>
  <body>
    <div style="display: flex; flex-direction: row; gap: 8px">
      <div

          width: 300px;
          height: 200px;
          background: var(--bg);
          padding: 20px;
        "
      >
        <p
          style="
            font-family: sans-serif;
            color: var(--heading);
            font-size: 16pxpx;
            font-weight: 500;
          "
        >
          Welcome
        </p>
        <h2
          style="
            font-family: sans-serif;
            color: var(--text-color);
            text-transform: uppercase;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.12em;
            margin: 0;
          "
        >
          Heading 1
        </h2>
        <p
          style="
            font-family: sans-serif;
            color: var(--text-color);
            font-size: 18px;
            font-weight: 500;
          "
        >
          Subheading for the first box
        </p>
      </div>
      <div
        style="
          width: 300px;
          height: 200px;

          padding: 20px;

            margin: 0;

          style="
            font-family: sans-serif;
            color: var(--text-color2);
            font-size: 18px;
            font-weight: 500;
          "

        </p>
      </div>
      <div
        style="
          width: 300px;
          height: 200px;
          background: var(--bg3);

        <p
          style="
            font-family: sans-serif;

        <p
          style="
            font-family: sans-serif;
            color: var(--text-color3);
            font-size: 18px;
            font-weight: 500;
          "
        >
          Subheading for the third box
        </p>
      </div>
    </div>

</html>
