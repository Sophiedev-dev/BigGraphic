<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      :root {
        --accent: #e94560;
        --bg: #1a1a2e;
        --surface: #16213e;
        --text: #ffffff;
        --text-muted: #a0a0c0;
        --radius: 16px;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);

        --space-sm: 8px;
        --space-md: 16px;
        --space-lg: 40px;
        --space-xl: 64px;

        --text-xs: 12px;
        --text-sm: 14px;
        --text-md: 18px;
        --text-lg: 24px;
        --text-xl: 40px;
        --text-2xl: 64px;
      }
      h1,
      h2 {
        font-family: Georgia, serif;
      }
      p {
        font-family: Arial, sans-serif;
      }
    </style>
  </head>
  <body style="margin: 0; padding: 40px">
    <div
      style="
        width: 400px;
        padding: 32px;
        box-sizing: border-box;
        background: var(--surface);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        font-family: sans-serif;
      "
    >
      <p
        style="
          margin: 0 0 12px 0;
          color: var(--accent);
          font-size: 12px;
          letter-spacing: 0.12em;
          text-transform: uppercase;
        "
      >
        Mon Brand
      </p>
      <h1 style="margin: 0 0 12px 0; color: var(--text); font-size: 32px">
        Titre principal
      </h1>

      <p style="margin: 0; color: var(--text-muted); font-size: 16px">
        Une phrase de soutien.
      </p>
    </div>
  </body>
</html>
