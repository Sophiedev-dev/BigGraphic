<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --bg: #ffffff;
        --accent: #e8662e;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <div style="display: flex; flex-direction: column; align-items: center">
      <svg
        width="16"
        height="16"
        viewBox="0 0 100 100"
        style="margin-bottom: 2px"
      >
        <circle cx="100" cy="50" r="50" fill="#12261e" />
        <circle cx="90" cy="50" r="30" fill="var(--bg)" />

        <circle cx="-4" cy="50" r="50" fill="#e8a33d" />
        <circle cx="7" cy="50" r="30" fill="var(--bg)" />
      </svg>
      <p
        style="
          font-size: 5px;
          text-transform: uppercase;
          margin: 0;
          color: #12261e;
          letter-spacing: 0.12em;
        "
      >
        chanel
      </p>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center">
      <svg
        width="16"
        height="16"
        viewBox="0 0 100 100"
        style="border: 1px solid #e8a33d; margin-bottom: 2px"
      >
        <polygon points="50,3 90,50 5,50" />
        <rect x="8" y="53" width="80" height="40" rx="0" fill="#12261e" />
        <rect x="40" y="60" width="40" height="20" rx="0" fill="#e8a33d" />
      </svg>
      <p
        style="
          font-size: 5px;
          text-transform: uppercase;
          margin: 0;
          color: #12261e;
          letter-spacing: 0.12em;
        "
      >
        House
      </p>
    </div>

    <!-- 1. Lune : un cercle safran + un cercle blanc décalé qui le "mange" -->
    <div style="display: flex; flex-direction: column; align-items: center">
      <svg
        width="16"
        height="16"
        viewBox="0 0 100 100"
        style="margin-bottom: 3px"
      >
        <circle cx="50" cy="50" r="40" fill="#e8a33d" />
        <circle cx="68" cy="40" r="32" fill="#ffffff" />
      </svg>
      <p
        style="
          font-size: 5px;
          text-transform: uppercase;
          margin: 0;
          color: #12261e;
          letter-spacing: 0.12em;
        "
      >
        moon
      </p>
    </div>
    <!-- 2. Cible : 3 cercles l'un dans l'autre -->
    <svg width="16" height="16" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="45" fill="#12261e" />
      <circle cx="50" cy="50" r="30" fill="#ffffff" />
      <circle cx="50" cy="50" r="15" fill="#e8a33d" />
    </svg>

    <!-- 3. Soleil sur l'horizon : un cercle + un rectangle -->
    <svg width="16" height="16" viewBox="0 0 100 100">
      <circle cx="50" cy="55" r="30" fill="#e8a33d" />
      <rect x="5" y="70" width="90" height="25" fill="#12261e" />
    </svg>

    <!-- 4. Cadenas : un anneau (cercle + trou) + un rectangle -->
    <svg width="16" height="16" viewBox="0 0 100 100">
      <circle cx="50" cy="40" r="25" fill="#12261e" />
      <circle cx="50" cy="40" r="14" fill="#ffffff" />
      <rect x="20" y="45" width="60" height="48" fill="#12261e" />
      <rect x="45" y="60" width="10" height="20" fill="#e8a33d" />
    </svg>

    <svg width="16" height="16" viewBox="0 0 100 100">
      <circle cx="90" cy="50" r="30" fill="#e8a33d" />
      <circle cx="100" cy="0" r="50" fill="#12261e" />

      <circle cx="12" cy="50" r="30" fill="#e8a33d" />
      <circle cx="0" cy="100" r="50" fill="#12261e" />
    </svg>
  </body>
</html>
