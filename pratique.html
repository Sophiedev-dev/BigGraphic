<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      :root {
        --accent: #ffd000;
        --accent-secondary: #aaa82c;
        --bg: #1a1a2e;
        --surface: #16213e;
        --text: #ffffff;
        --text-muted: #a0a0c0;
        --radius: 16px;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        --space-sm: 8px;
        --space-md: 16px;
        --space-lg: 40px;
        --space-xl: 64px;
        --text-xs: 12px;
        --text-sm: 14px;
        --text-md: 18px;
        --text-lg: 24px;
        --text-xl: 40px;
        --text-2xl: 64px;
      }
      h1,
      h2 {
        font-family: Georgia, serif;
      }
      p {
        font-family: Arial, sans-serif;
      }
    </style>
  </head>
  <body style="margin: 0; padding: 40px">
    <div
      style="
        width: 400px;
        height: 400px;
        padding: var(--space-lg);
        border-radius: 50px 0px;
        box-sizing: border-box;
        background: var(--surface);
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      "
    >
      <div>
        <p
          style="
            color: var(--accent);
            font-size: var(--text-lg);
            margin: 0 0 var(--space-sm) 0;
            font-style: oblique;
          "
        >
          Cafe Mbolo
        </p>
        <p
          style="
            color: var(--text);
            font-size: var(--text-lg);
            margin: 0 0 var(--space-md) 0;
          "
        >
          Petit-dejeuner complet a
        </p>
        <div
          style="
            display: inline-block;
            background: var(--accent);
            justify-content: center;
            align-items: center;
            text-align: center;
            border-radius: 999px;
            padding: var(--space-sm) var(--space-md);
          "
        >
          <h1
            style="
              color: var(--on-accent);
              font-size: var(--text-xl);
              margin: 0;
            "
          >
            2500 FCFA
          </h1>
        </div>
        <p
          style="
            color: var(--text);
            font-size: var(--text-md);
            margin: var(--space-md) 0 var(--space-md) 0;
          "
        >
          Entre
        </p>

        <div style="display: flex; align-items: center; gap: var(--space-md)">
          <div
            style="
              width: 50px;
              height: 50px;
              background: transparent;
              border: 2px solid var(--accent);
              border-radius: 50%;
              display: flex;
              align-items: center;
              justify-content: center;
            "
          >
            <h2
              style="color: var(--accent); font-size: var(--text-sm); margin: 0"
            >
              7h
            </h2>
          </div>
          <p style="margin: 0; font-size: var(--text-md); color: var(--text)">
            et
          </p>
          <div
            style="
              width: 50px;
              height: 50px;
              background: transparent;
              border: 2px solid var(--accent);
              border-radius: 50%;
              display: flex;
              align-items: center;
              justify-content: center;
            "
          >
            <h2 style="color: var(--accent); font-size: var(--text-sm)">10h</h2>
          </div>
        </div>
      </div>

      <p
        style="
          color: var(--text-muted);
          font-size: var(--text-md);
          margin: 0;
          font-style: italic;
        "
      >
        Venez Decouvrir des Saveurs Intense
      </p>
    </div>
  </body>
</html>
