<!doctype html>
<html lang="fr">

    <style>
      :root {
        --bg: #ffffff;

      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 16px;
      }

  </head>

        <circle cx="100" cy="50" r="50" fill="#12261e" />

        <circle cx="-4" cy="50" r="50" fill="#e8a33d" />

    </div>

     <p

">

</html>
