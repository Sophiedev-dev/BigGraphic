<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --bg: #ffffff;
        --accent: #e8662e;
      }
    </style>
  </head>
  <body>
    <svg
      width="16"
      height="16"
      viewBox="0 0 100 100"
      style="border: 20px solid var(--bg)"
    >
      <circle cx="100" cy="50" r="50" fill="#12261e" />
      <circle cx="90" cy="50" r="30" fill="var(--bg)" />

      <circle cx="-4" cy="50" r="50" fill="#e8a33d" />
      <circle cx="7" cy="50" r="30" fill="var(--bg)" />
    </svg>
  </body>
</html>
