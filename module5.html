<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      :root {
        --accent: #ffd000;
        --accent-secondary: #aaa82c;
        --bg: #1a1a2e;
        --surface: #16213e;
        --text: #ffffff;
        --text-muted: #a0a0c0;
        --radius: 16px;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        --space-sm: 8px;
        --space-md: 16px;
        --space-lg: 40px;
        --space-xl: 64px;
        --text-xs: 12px;
        --text-sm: 14px;
        --text-md: 18px;
        --text-lg: 24px;
        --text-xl: 40px;
        --text-2xl: 64px;
      }
      h1,
      h2 {
        font-family: Georgia, serif;
      }
      p {
        font-family: Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <body style="margin: 0; padding: 40px; background: var(--bg)">
      <div
        style="
          width: 400px;
          box-sizing: border-box;
          padding: 32px;
          background: var(--surface);
          border-radius: var(--radius);
          font-family: Arial, sans-serif;
          margin-top: 100px;
        "
      >
        <p
          style="
            margin: 0 0 var(--space-sm);
            color: var(--accent);
            font-size: var(--text-sm);
          "
        >
          IRON GYM YAOUNDÉ
        </p>
        <h2
          style="
            margin: 0 0 var(--space-lg);
            color: var(--text);
            font-size: var(--text-lg);
            line-height: 1;
          "
        >
          Train with a coach this month
        </h2>
        <p
          style="
            margin: 0 0 var(--space-md);
            color: var(--text-muted);
            font-size: var(--text-md);
            line-height: 1.5;
          "
        >
          Personal coaching sessions, a nutrition plan and full gym access, open
          every day from 6h to 22h.
        </p>
        <p
          style="
            margin: 0 0 var(--space-lg) 0;
            color: var(--accent);
            font-size: var(--text-lg);
          "
        >
          15 000 FCFA / month
        </p>
        <p
          style="
            margin: 0 0 var(--space-sm);
            color: var(--text);
            font-size: var(--text-md);
          "
        >
          Sign up at the front desk
        </p>
      </div>
    </body>
  </body>
</html>
