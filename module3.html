<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root {
            --accent: #00c896;
            --bg: #1a1a2e;
            --text: #ffffff;
            --radius: 16px;
            --shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

    </style>
</head>
<body>

    <div style="width: 400px; padding:32px; background: var(--bg); border: radius 16px;">
        <h1 style="margin: 0 0 16px 0; color: var(--text);">Hello</h1>
        <div style="width:40px; height: 60px;background:var(--accent)"></div>
        <p style="margin:16px 0 0 0; color:var(--accent)">Mon texte accent</p>
    </div>
    
</body>
</html>
