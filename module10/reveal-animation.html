<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --bg: #ffffff;
        --accent: #e8662e;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 16px;
      }

      /* ===== ANIMATION AJOUTÉE ===== */
      .mark circle {
        stroke-width: 3;
        stroke-dasharray: 1; /* un seul tiret = tout le cercle */
        stroke-dashoffset: 1; /* tiret caché au départ */
        fill-opacity: 0; /* couleur invisible au départ */
        animation:
          draw 1.5s ease 1.2s forwards,
          /* démarre après 1.2s */ fill-in 0.5s ease 2.7s forwards; /* 1.2s + 1.5s */
      }
      @keyframes draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes fill-in {
        to {
          fill-opacity: 1;
        }
      }

      /* ===== REVEAL AJOUTÉ (10.3) ===== */
      .reveal {
        opacity: 0;
        transform: translateY(40px); /* était 20px */
        animation: reveal 1.2s ease forwards; /* était 0.6s */
      }
      @keyframes reveal {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div
      class="reveal"
      style="display: flex; flex-direction: column; align-items: center"
    >
      <svg
        class="mark"
        width="16"
        height="16"
        viewBox="0 0 100 100"
        style="margin-bottom: 2px"
      >
        <circle
          pathLength="1"
          cx="100"
          cy="50"
          r="50"
          fill="#12261e"
          stroke="#12261e"
        />
        <circle
          pathLength="1"
          cx="90"
          cy="50"
          r="30"
          fill="var(--bg)"
          stroke="var(--bg)"
        />

        <circle
          pathLength="1"
          cx="-4"
          cy="50"
          r="50"
          fill="#e8a33d"
          stroke="#e8a33d"
        />
        <circle
          pathLength="1"
          cx="7"
          cy="50"
          r="30"
          fill="var(--bg)"
          stroke="var(--bg)"
        />
      </svg>
    </div>

    <p
      class="reveal"
      style="
        font-size: 5px;
        text-transform: uppercase;
        margin: 0;
        color: #12261e;
        letter-spacing: 0.12em;
      "
    >
      chanel
    </p>

    <div
      class="reveal"
      style="display: flex; flex-direction: column; align-items: center"
    >
      <svg
        class="mark"
        width="16"
        height="16"
        viewBox="0 0 100 100"
        style="margin-bottom: 2px"
      >
        <circle
          pathLength="1"
          cx="100"
          cy="50"
          r="50"
          fill="#12261e"
          stroke="#12261e"
        />
        <circle
          pathLength="1"
          cx="90"
          cy="50"
          r="30"
          fill="var(--bg)"
          stroke="var(--bg)"
        />

        <circle
          pathLength="1"
          cx="-4"
          cy="50"
          r="50"
          fill="#e8a33d"
          stroke="#e8a33d"
        />
        <circle
          pathLength="1"
          cx="7"
          cy="50"
          r="30"
          fill="var(--bg)"
          stroke="var(--bg)"
        />
      </svg>
      <p
        style="
          font-size: 5px;
          text-transform: uppercase;
          margin: 0;
          color: #12261e;
          letter-spacing: 0.12em;
        "
      >
        chanel
      </p>
    </div>
  </body>
</html>
