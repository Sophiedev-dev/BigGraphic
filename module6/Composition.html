<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>module 6</title>
    <style>
      :root {
        --accent: #e94560;
        --bg: #1a1a2e;
        --surface: #16213e;
        --text: #ffffff;
        --text-muted: #a0a0c0;
        --radius: 16px;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);

        --space-sm: 8px;
        --space-md: 16px;
        --space-lg: 40px;
        --space-xl: 64px;

        --text-xs: 12px;
        --text-sm: 14px;
        --text-md: 18px;
        --text-lg: 24px;
        --text-xl: 40px;
        --text-2xl: 64px;
      }
      h1,
      h2 {
        font-family: Georgia, serif;
      }
      p {
        font-family: Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      style="
        width: 700px;
        height: 500px;
        background: #ffffff;
        display: flex;
        flex-direction: row;
        align-items: center;
        padding: var(--space-xl);
        gap: 50px;
      "
    >
      <!--icon-->
      <div
        style="
          width: 200px;
          height: 200px;
          background: #fbfcfc;
          padding: var(--space-sm);
          border-radius: 60px;
          box-shadow: var(--shadow);
        "
      >
        <div
          style="
            width: 100px;
            height: 100px;
            background: #1453c9;
            border-radius: 50%;
            margin-bottom: 5px;
            margin-left: 40px;
            margin-top: 15px;
          "
        ></div>
        <div
